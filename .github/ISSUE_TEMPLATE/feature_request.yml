name: Feature request
description: Propose an improvement that fits the source-to-insight-to-HTML workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user situation before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs or alternatives

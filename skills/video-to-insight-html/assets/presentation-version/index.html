<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI 增强型的人｜图形速览版</title>
  <style>
    :root {
      --paper: #f1f4f6;
      --white: #fbfcfd;
      --ink: #13233c;
      --muted: #748091;
      --line: #cbd3dc;
      --ai: #3269d8;
      --ai-soft: #dfe9ff;
      --human: #f1ad3f;
      --human-soft: #fff0d5;
      --result: #1f765f;
      --result-soft: #dcefe9;
      --risk: #d85e50;
      --risk-soft: #f8ded9;
      --shadow: 0 28px 80px rgba(3, 14, 31, .3);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: #0d1827;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    button, select { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid #8ab4ff;
      outline-offset: 3px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, 380px);
      gap: 26px;
      align-items: center;
      padding: 26px;
    }

    .preview {
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .stage-wrap {
      width: min(74vw, calc(90vh * .75));
      aspect-ratio: 3 / 4;
      filter: drop-shadow(var(--shadow));
    }

    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      container-type: inline-size;
      background:
        linear-gradient(rgba(19,35,60,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(19,35,60,.045) 1px, transparent 1px),
        var(--paper);
      background-size: 6cqw 6cqw;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, rgba(255,255,255,.72), transparent 58%);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 33cqw 1fr auto;
      padding: 5.8cqw 6.4cqw 7cqw;
      opacity: 0;
      pointer-events: none;
      transform: translateY(1.4cqw);
    }

    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: none;
      animation: slideIn .42s cubic-bezier(.2,.75,.25,1) both;
    }

    .slide-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.8cqw;
      align-items: center;
      padding-bottom: 2cqw;
      border-bottom: .14cqw solid var(--line);
    }

    .chapter-number {
      width: 5.4cqw;
      height: 5.4cqw;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      border-radius: 50%;
      font: 800 2cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .chapter-name {
      font-size: 1.95cqw;
      font-weight: 760;
      letter-spacing: .025em;
    }

    .slide-count {
      color: var(--muted);
      font: 700 1.5cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .claim {
      align-self: center;
      max-width: 96%;
      margin: 0;
      font-size: 5.8cqw;
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -.055em;
      text-wrap: balance;
    }

    .claim strong {
      padding-inline: .07em;
      color: var(--accent, var(--result));
      background: linear-gradient(transparent 68%, var(--accent-soft, var(--result-soft)) 0);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .visual {
      min-height: 0;
      display: grid;
      align-content: center;
      position: relative;
      border-top: .18cqw solid rgba(19,35,60,.12);
    }

    .slide-foot { padding-top: 1.5cqw; }
    .model-rail { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); isolation: isolate; }
    .model-rail::before { content: ""; position: absolute; left: 8%; right: 8%; top: 1.35cqw; height: .18cqw; background: var(--line); z-index: 0; }
    .model-step { display: grid; justify-items: center; gap: .55cqw; color: var(--muted); font-size: 1.15cqw; font-weight: 700; position: relative; z-index: 1; }
    .model-step::before { content: ""; width: 2.7cqw; height: 2.7cqw; border: .38cqw solid var(--paper); border-radius: 50%; background: var(--white); box-shadow: 0 0 0 .16cqw var(--line); }
    .model-step.is-active { color: var(--ink); }
    .model-step.is-active::before { background: var(--human); box-shadow: 0 0 0 .16cqw var(--ink), 0 0 0 .65cqw rgba(241,173,63,.16); }

    .enter > * { opacity: 0; transform: translateY(1.7cqw); }
    .is-active .enter > * { animation: reveal .48s cubic-bezier(.2,.75,.25,1) both; }
    .is-active .enter > *:nth-child(1) { animation-delay: .12s; }
    .is-active .enter > *:nth-child(2) { animation-delay: .23s; }
    .is-active .enter > *:nth-child(3) { animation-delay: .34s; }
    .is-active .enter > *:nth-child(4) { animation-delay: .45s; }
    .is-active .enter > *:nth-child(5) { animation-delay: .56s; }
    .is-active .enter > *:nth-child(6) { animation-delay: .67s; }

    .node {
      min-height: 12cqw;
      display: grid;
      place-items: center;
      padding: 2cqw;
      text-align: center;
      color: var(--ink);
      background: rgba(255,255,255,.83);
      border: .16cqw solid var(--line);
      font-size: 2.25cqw;
      font-weight: 780;
      line-height: 1.25;
      position: relative;
      z-index: 2;
    }

    .node.ai { color: var(--ai); border-color: var(--ai); background: var(--ai-soft); }
    .node.human { color: #8d5703; border-color: var(--human); background: var(--human-soft); }
    .node.result { color: #fff; border-color: var(--result); background: var(--result); }
    .node.dim { color: var(--muted); }
    .arrow { color: var(--ai); font-size: 4cqw; font-weight: 840; text-align: center; }

    /* 01 核心变化 */
    .shift-map {
      display: grid;
      grid-template-columns: .72fr auto 1.35fr;
      align-items: center;
      gap: 2.5cqw;
    }

    .result-chain { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5cqw; }
    .adopted {
      grid-column: 1 / -1;
      justify-self: end;
      width: 63%;
      margin-top: 1.8cqw;
      padding: 1.4cqw;
      text-align: center;
      color: var(--result);
      background: var(--result-soft);
      font-size: 1.9cqw;
      font-weight: 760;
    }

    /* 02 人机分工 */
    .division-map { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; }
    .role-board { padding: 2.6cqw; background: rgba(255,255,255,.76); border-top: .65cqw solid var(--ai); }
    .role-board.human { border-color: var(--human); }
    .role-board h3 { margin: 0 0 2.2cqw; color: var(--ai); font-size: 3.2cqw; }
    .role-board.human h3 { color: #8d5703; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1cqw; }
    .role-grid span { min-height: 7cqw; display: grid; place-items: center; padding: 1cqw; background: var(--white); font-size: 1.65cqw; font-weight: 710; text-align: center; }

    /* 03 两种交付 */
    .delivery-compare { display: grid; grid-template-columns: 1fr 1.15fr; gap: 2.4cqw; align-items: stretch; }
    .delivery-side { min-height: 31cqw; display: grid; align-content: center; justify-items: center; gap: 2cqw; padding: 2.8cqw; background: rgba(255,255,255,.8); border: .16cqw solid var(--line); }
    .delivery-side.result-side { border-color: var(--result); }
    .sheet-shape { width: 16cqw; height: 20cqw; border: .3cqw solid var(--muted); background: repeating-linear-gradient(to bottom, transparent 0 3.3cqw, var(--line) 3.3cqw 3.5cqw); }
    .delivery-side b { font-size: 2.6cqw; }
    .mini-loop { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1cqw; }
    .mini-loop span { min-height: 7cqw; display: grid; place-items: center; color: var(--result); background: var(--result-soft); font-size: 1.55cqw; font-weight: 760; text-align: center; }
    .result-block { width: 100%; padding: 2.1cqw; color: #fff; background: var(--result); text-align: center; font-size: 2.5cqw; font-weight: 820; }

    /* 04 闭环 */
    .process-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqw; counter-reset: process; }
    .process-map .node { counter-increment: process; grid-template-columns: auto 1fr; gap: 1.3cqw; place-items: center start; text-align: left; }
    .process-map .node::before { content: counter(process, decimal-leading-zero); color: var(--ai); font: 800 1.5cqw/1 ui-monospace, monospace; }
    .process-map .node:nth-child(4), .process-map .node:nth-child(5) { border-top: .45cqw solid var(--human); }
    .process-map .node:last-child::before { color: #bce7db; }

    /* 05 标准化产出 */
    .commodity-map { display: grid; grid-template-columns: 1.35fr .7fr; gap: 3cqw; align-items: center; }
    .commodity-cloud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1cqw; }
    .commodity-cloud span { min-height: 7.5cqw; display: grid; place-items: center; padding: 1cqw; background: rgba(255,255,255,.82); border-bottom: .22cqw solid var(--ai); font-size: 1.55cqw; font-weight: 720; text-align: center; }
    .cost-drop { min-height: 29cqw; display: grid; grid-template-rows: auto 1fr auto; padding: 2.5cqw; color: #fff; background: var(--ink); }
    .cost-drop span { font-size: 1.7cqw; }
    .cost-drop b { align-self: center; font-size: 8cqw; line-height: 1; }
    .cost-drop strong { color: #b7cef8; font-size: 2.2cqw; }

    /* 06 时间线 */
    .era-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8cqw; position: relative; isolation: isolate; }
    .era-map::before { content: ""; position: absolute; left: 8%; right: 8%; top: 6.4cqw; height: .2cqw; background: var(--line); z-index: 0; }
    .era-node { min-height: 29cqw; display: grid; align-content: start; gap: 3cqw; padding: 2.4cqw; background: rgba(255,255,255,.84); border-top: .55cqw solid var(--line); position: relative; z-index: 1; }
    .era-node:nth-child(2) { border-color: var(--ai); }
    .era-node:nth-child(3) { border-color: var(--human); }
    .era-node time { color: var(--muted); font: 760 1.55cqw/1 ui-monospace, monospace; }
    .era-node b { font-size: 2.8cqw; line-height: 1.25; }
    .era-node span { color: var(--muted); font-size: 1.65cqw; line-height: 1.4; }

    /* 07 具体情境做选择 */
    .choice-map { display: grid; grid-template-columns: 1fr .55fr; gap: 3cqw; align-items: center; }
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.3cqw; }
    .option { min-height: 10cqw; display: grid; place-items: center; color: var(--ai); background: var(--ai-soft); border: .16cqw solid #9cb7ec; font-size: 3cqw; font-weight: 820; }
    .option.chosen { color: #fff; background: var(--result); border-color: var(--result); box-shadow: 0 0 0 .7cqw var(--result-soft); }
    .context-filter { display: grid; gap: 1.2cqw; }
    .context-filter span { padding: 1.5cqw; color: #8d5703; background: var(--human-soft); font-size: 1.7cqw; font-weight: 740; text-align: center; }
    .context-filter b { padding: 2cqw; color: #fff; background: var(--human); text-align: center; font-size: 2.4cqw; }

    /* 08 判断力三角 */
    .judgement-map { height: 34cqw; position: relative; isolation: isolate; }
    .judgement-map::before, .judgement-map::after, .judgement-line {
      content: "";
      position: absolute;
      height: .22cqw;
      background: var(--line);
      transform-origin: left center;
      z-index: 0;
    }
    .judgement-map::before { width: 32cqw; left: 25%; top: 23%; transform: rotate(28deg); }
    .judgement-map::after { width: 32cqw; left: 51%; top: 76%; transform: rotate(-28deg); }
    .judgement-line { width: 28cqw; left: 25%; top: 76%; transform: rotate(-90deg); }
    .judgement-point { width: 15cqw; height: 15cqw; display: grid; place-items: center; padding: 1.5cqw; border-radius: 50%; background: var(--white); border: .2cqw solid var(--human); text-align: center; font-size: 1.9cqw; font-weight: 760; position: absolute; z-index: 2; }
    .judgement-point:nth-child(2) { left: 12%; top: 4%; }
    .judgement-point:nth-child(3) { right: 12%; top: 4%; }
    .judgement-point:nth-child(4) { left: 50%; bottom: 0; transform: translateX(-50%); }
    .judgement-center { width: 13cqw; height: 13cqw; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--ink); font-size: 2.4cqw; font-weight: 820; position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); z-index: 3; }

    /* 09 我会到结果 */
    .value-shift { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 1.5cqw; align-items: center; }
    .value-shift .node { min-height: 18cqw; }

    /* 10 能力翻译 */
    .mapping-map { display: grid; grid-template-columns: .8fr auto 1.25fr; gap: 1.5cqw 2cqw; align-items: center; }
    .mapping-map .skill, .mapping-map .outcome { min-height: 7.6cqw; display: grid; place-items: center; padding: 1cqw; font-size: 1.7cqw; font-weight: 740; text-align: center; }
    .mapping-map .skill { color: var(--muted); background: rgba(255,255,255,.82); }
    .mapping-map .outcome { color: var(--result); background: var(--result-soft); }
    .mapping-map .map-arrow { color: var(--result); font-size: 2.7cqw; font-weight: 820; }

    /* 11 售卖结果 */
    .sell-map { display: grid; grid-template-columns: .65fr 1.35fr; gap: 3cqw; align-items: end; }
    .hour-box { min-height: 18cqw; display: grid; place-items: center; color: var(--muted); background: rgba(255,255,255,.82); border: .2cqw solid var(--line); font-size: 3cqw; font-weight: 800; }
    .outcome-stack { display: grid; gap: 1.1cqw; }
    .outcome-stack span { min-height: 7cqw; display: grid; place-items: center; background: var(--result-soft); color: var(--result); font-size: 1.8cqw; font-weight: 760; }
    .outcome-stack span:last-child { min-height: 9cqw; color: #fff; background: var(--result); font-size: 2.4cqw; }

    /* 12 采用网络 */
    .adoption-map { display: grid; grid-template-columns: .7fr 1.3fr; gap: 3cqw; align-items: center; }
    .solution-stack { display: grid; gap: .8cqw; }
    .solution-stack span { padding: 1.4cqw; color: var(--ai); background: var(--ai-soft); text-align: center; font-size: 1.7cqw; font-weight: 750; }
    .solution-stack span:nth-child(n+4) { opacity: .48; }
    .people-network { height: 32cqw; position: relative; isolation: isolate; }
    .people-network::before, .people-network::after { content: ""; position: absolute; left: 13%; right: 13%; top: 50%; height: .2cqw; background: var(--line); transform: rotate(25deg); z-index: 0; }
    .people-network::after { transform: rotate(-25deg); }
    .person { width: 8.5cqw; height: 8.5cqw; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--ink); font-size: 1.45cqw; font-weight: 760; position: absolute; z-index: 2; }
    .person:nth-child(1) { left: 5%; top: 3%; }
    .person:nth-child(2) { right: 5%; top: 3%; }
    .person:nth-child(3) { left: 8%; bottom: 2%; }
    .person:nth-child(4) { right: 8%; bottom: 2%; }
    .person.center { width: 13cqw; height: 13cqw; left: 50%; top: 50%; transform: translate(-50%,-50%); color: var(--ink); background: var(--human); font-size: 2.1cqw; }

    /* 13 冰山 */
    .iceberg-map { display: grid; grid-template-rows: auto .22cqw auto; width: 78%; margin-inline: auto; }
    .surface { padding: 2.4cqw; color: var(--ai); background: var(--ai-soft); clip-path: polygon(22% 0,78% 0,64% 100%,36% 100%); text-align: center; font-size: 2.5cqw; font-weight: 800; }
    .water { background: var(--ai); }
    .underwater { padding: 4.8cqw 3cqw 4cqw; color: #fff; background: var(--ink); clip-path: polygon(36% 0,64% 0,100% 100%,0 100%); text-align: center; font-size: 3cqw; font-weight: 820; }

    /* 14 能力栈 */
    .capability-map { width: 88%; margin-inline: auto; display: grid; gap: 1.2cqw; align-items: end; }
    .capability-layer { min-height: 10.5cqw; display: grid; grid-template-columns: 6cqw 1fr; align-items: center; gap: 1.6cqw; padding: 2cqw 2.8cqw; color: #fff; background: var(--ink); }
    .capability-layer:nth-child(1) { width: 72%; margin-inline: auto; color: var(--ink); background: var(--human); }
    .capability-layer:nth-child(2) { width: 86%; margin-inline: auto; background: var(--ai); }
    .capability-layer b { font: 800 1.7cqw/1 ui-monospace, monospace; }
    .capability-layer span { font-size: 2.05cqw; font-weight: 770; }

    /* 15 组合优势 */
    .combine-map { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 1.4cqw; align-items: center; }
    .combine-map .node { min-height: 16cqw; }
    .combined-result { grid-column: 1 / -1; justify-self: center; width: 62%; margin-top: 2cqw; padding: 2cqw; color: #fff; background: var(--result); text-align: center; font-size: 2.5cqw; font-weight: 820; }

    /* 16 两条工作路径 */
    .road-map { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5cqw; }
    .road { min-height: 32cqw; padding: 2.5cqw; background: rgba(255,255,255,.78); border-top: .55cqw solid var(--line); }
    .road.adaptive { border-color: var(--result); }
    .road h3 { margin: 0 0 2.2cqw; font-size: 2.5cqw; }
    .road-path { display: grid; gap: 1.1cqw; }
    .road-path span { padding: 1.2cqw 1.5cqw; background: var(--white); color: var(--muted); font-size: 1.55cqw; font-weight: 710; }
    .road-path span:last-child { color: var(--risk); background: var(--risk-soft); }
    .adaptive .road-path span { color: var(--result); background: var(--result-soft); }
    .adaptive .road-path span:last-child { color: #fff; background: var(--result); }

    /* 17 分界线 */
    .divide-map { display: grid; grid-template-columns: 1fr .18cqw 1fr; gap: 3cqw; align-items: center; }
    .divide-line { height: 29cqw; background: var(--line); }
    .divide-side { min-height: 28cqw; display: grid; align-content: center; gap: 2cqw; padding: 2.5cqw; text-align: center; }
    .divide-side b { font-size: 3.1cqw; }
    .divide-side span { color: var(--muted); font-size: 1.7cqw; }
    .divide-side.owner { color: var(--result); background: var(--result-soft); }
    .divide-side.owner span { color: var(--result); }

    /* 18 开始路径 */
    .start-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4cqw; counter-reset: start; }
    .start-map span { counter-increment: start; min-height: 12cqw; display: grid; grid-template-columns: auto 1fr; gap: 1cqw; place-items: center start; padding: 1.7cqw; background: rgba(255,255,255,.82); border-bottom: .4cqw solid var(--ai); font-size: 1.65cqw; font-weight: 730; }
    .start-map span::before { content: counter(start, decimal-leading-zero); color: var(--ai); font: 800 1.4cqw/1 ui-monospace, monospace; }
    .start-map span:nth-child(n+4) { border-color: var(--result); }

    /* 19 三个复盘问题 */
    .review-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.7cqw; }
    .review-question { min-height: 29cqw; display: grid; align-content: space-between; padding: 2.4cqw; background: rgba(255,255,255,.84); border-top: .55cqw solid var(--ai); }
    .review-question:nth-child(2) { border-color: var(--human); }
    .review-question:nth-child(3) { border-color: var(--result); }
    .review-question b { color: var(--muted); font: 800 2.1cqw/1 ui-monospace, monospace; }
    .review-question span { font-size: 2.25cqw; font-weight: 790; line-height: 1.35; }

    /* 20 结果责任 */
    .final-map { display: grid; grid-template-columns: 1fr 1fr; gap: 1.3cqw; }
    .final-map span { min-height: 9cqw; display: grid; place-items: center; padding: 1.4cqw; color: var(--muted); background: rgba(255,255,255,.84); font-size: 1.9cqw; font-weight: 750; text-align: center; }
    .final-target { grid-column: 1 / -1; justify-self: center; width: 72%; min-height: 12cqw !important; color: #fff !important; background: var(--result) !important; font-size: 3cqw !important; }

    /* 统一具象图形语言：大图形讲关系，文字只做必要定位 */
    .scene-illustration {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      transform: translateY(-12cqw);
    }

    .scene-illustration .tone-ink { color: var(--ink); }
    .scene-illustration .tone-muted { color: var(--muted); }
    .scene-illustration .tone-ai { color: var(--ai); }
    .scene-illustration .tone-human { color: var(--human); }
    .scene-illustration .tone-result { color: var(--result); }
    .scene-illustration .tone-risk { color: var(--risk); }
    .scene-illustration .soft-ai { fill: var(--ai-soft); }
    .scene-illustration .soft-human { fill: var(--human-soft); }
    .scene-illustration .soft-result { fill: var(--result-soft); }
    .scene-illustration .soft-risk { fill: var(--risk-soft); }
    .scene-illustration .paper-fill { fill: var(--white); }
    .scene-illustration .ink-fill { fill: var(--ink); }
    .scene-illustration .ai-fill { fill: var(--ai); }
    .scene-illustration .human-fill { fill: var(--human); }
    .scene-illustration .result-fill { fill: var(--result); }
    .scene-illustration .risk-fill { fill: var(--risk); }
    .scene-illustration .link {
      fill: none;
      stroke: var(--line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .scene-illustration .link.ai { stroke: var(--ai); }
    .scene-illustration .link.human { stroke: var(--human); }
    .scene-illustration .link.result { stroke: var(--result); }
    .scene-illustration .link.risk { stroke: var(--risk); }
    .scene-illustration .link.dashed { stroke-dasharray: 10 10; }
    .scene-illustration .backplate { fill: var(--paper); stroke: var(--line); stroke-width: 3; }
    .scene-illustration .label {
      fill: var(--ink);
      font-size: 24px;
      font-weight: 780;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .scene-illustration .label.small { font-size: 20px; }
    .scene-illustration .label.ai { fill: var(--ai); }
    .scene-illustration .label.human { fill: #8b5605; }
    .scene-illustration .label.result { fill: var(--result); }
    .scene-illustration .label.white { fill: #fff; }
    .scene-illustration .illustration-part { transform-box: fill-box; transform-origin: center; }
    .is-active .scene-illustration .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: drawLine .85s ease-out forwards; }
    .is-active .scene-illustration .pop { animation: pictogramPop .48s cubic-bezier(.2,.82,.25,1) both; }
    .is-active .scene-illustration .pop.d2 { animation-delay: .16s; }
    .is-active .scene-illustration .pop.d3 { animation-delay: .32s; }
    .is-active .scene-illustration .pop.d4 { animation-delay: .48s; }
    .is-active .scene-illustration .pop.d5 { animation-delay: .64s; }

    /* 统一图像语言：Lucide 线性图标 + 同尺寸透明节点 + 边缘连接 */
    .scene-illustration .system-node {
      fill: var(--paper);
      stroke: var(--line);
      stroke-width: 2.5;
    }
    .scene-illustration .system-node.is-result { stroke: #93bbae; }
    .scene-illustration .system-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .scene-illustration .system-link {
      fill: none;
      stroke: #aeb8c4;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .scene-illustration .system-link.dotted {
      stroke: #aeb8c4;
      stroke-width: 2;
      stroke-dasharray: 2 9;
    }
    .scene-illustration .system-divider {
      stroke: var(--line);
      stroke-width: 2;
      stroke-dasharray: 3 9;
    }
    .scene-illustration .system-label {
      fill: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 22px;
      font-weight: 760;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .scene-illustration .system-label.small { font-size: 18px; }
    .scene-illustration .system-label.muted { fill: var(--muted); }
    .scene-illustration .system-label.result { fill: var(--result); }
    .scene-illustration .system-label.human { fill: #9a6207; }
    .scene-illustration .system-label.ai { fill: var(--ai); }
    .scene-illustration .system-number {
      fill: var(--paper);
      stroke: var(--line);
      stroke-width: 2;
    }
    .scene-illustration .system-panel {
      fill: rgba(255,255,255,.22);
      stroke: var(--line);
      stroke-width: 2;
    }

    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }

    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: .55cqw;
      background: rgba(19,35,60,.1);
    }
    .progress-fill { width: 5%; height: 100%; background: var(--result); transition: width .35s ease; }

    .console {
      align-self: stretch;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
      padding: 21px;
      color: #edf3fc;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
    }
    .console-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .console-head strong { font-size: 16px; }
    .console-head span { color: #9cabc0; font: 700 12px/1 ui-monospace, monospace; }
    .controls { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
    .controls button { min-height: 42px; color: #edf3fc; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); cursor: pointer; }
    .controls button:hover { background: rgba(255,255,255,.14); }
    .notes { min-height: 0; overflow: auto; padding: 17px; color: #d6e0ec; background: rgba(4,12,23,.45); border-left: 3px solid var(--human); }
    .notes h2 { margin: 0 0 12px; color: #fff; font-size: 13px; letter-spacing: .08em; }
    .notes p { margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.8; }
    .hint { margin: 0; color: #95a5ba; font-size: 12px; line-height: 1.6; }

    body.clean { overflow: hidden; }
    body.clean .app { width: 100vw; height: 100vh; min-height: 0; display: grid; place-items: center; padding: 0; }
    body.clean .console { display: none; }
    body.clean .preview { width: 100%; height: 100%; }
    body.clean .stage-wrap { width: min(100vw, 75vh); height: auto; max-height: 100vh; aspect-ratio: 3 / 4; }

    @keyframes slideIn { from { opacity: 0; transform: translateY(1.4cqw); } to { opacity: 1; transform: none; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(1.7cqw); } to { opacity: 1; transform: none; } }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes pictogramPop { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; padding: 14px; }
      .stage-wrap { width: min(94vw, calc(82vh * .75)); }
      .console { width: min(94vw, 680px); justify-self: center; min-height: 460px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

    // 20 页统一视觉叙事。先画关系线、后画节点；任何线都不会横切图标。

      systemFlow([

      systemFlow([

      systemFlow([

      ], [140, 400, 660], 190, 108),

      systemSvg(`

      systemSvg(`

        ${systemIcon("briefcase", 230, 332, 44)}<text x="445" y="332" class="system-label">专业场景</text>
      `),

      systemSvg(`
        <path d="M150 163C150 235 325 235 365 270" class="system-link draw" marker-end="url(#system-arrow)"/>

        ${systemNode({ icon: "briefcase", label: "业务", labelPosition: "top", labelGap: 24 }, 150, 110, 90)}
        ${systemNode({ icon: "bot", label: "AI", tone: "tone-ai", delay: "d2", labelPosition: "top", labelGap: 24 }, 400, 110, 90)}
        ${systemNode({ icon: "handshake", label: "采用", tone: "tone-human", delay: "d3", labelPosition: "top", labelGap: 24 }, 650, 110, 90)}
        ${systemNode({ icon: "target", label: "可靠结果", tone: "tone-result", result: true, delay: "d4" }, 400, 330, 104)}
      `),

      systemSvg(`
        <line x1="72" y1="210" x2="728" y2="210" class="system-divider"/>
        <text x="90" y="82" class="system-label muted small" text-anchor="start">标准路径</text>
        <text x="90" y="252" class="system-label result small" text-anchor="start">负责路径</text>
        ${systemLink(267, 120, 353, 120)}${systemLink(447, 120, 533, 120)}
        ${systemLink(267, 300, 353, 300)}${systemLink(447, 300, 533, 300)}
        ${systemNode({ icon: "user", label: "等指令" }, 220, 120, 74)}
        ${systemNode({ icon: "file", label: "标准动作", delay: "d2" }, 400, 120, 74)}
        ${systemNode({ icon: "help", label: "遇变化停下", delay: "d3" }, 580, 120, 74)}
        ${systemNode({ icon: "search", label: "主动澄清", tone: "tone-human" }, 220, 300, 74)}
        ${systemNode({ icon: "route", label: "调整路径", delay: "d2" }, 400, 300, 74)}
        ${systemNode({ icon: "flag", label: "推到完成", tone: "tone-result", result: true, delay: "d3" }, 580, 300, 74)}
      `),

      systemSvg(`
        <line x1="400" y1="55" x2="400" y2="355" class="system-divider"/>
        ${systemNode({ icon: "bot", label: "会用 AI", tone: "tone-ai" }, 220, 190, 126)}
        ${systemNode({ icon: "shield", label: "独立负责", tone: "tone-result", result: true, delay: "d3" }, 580, 190, 126)}
      `),

      systemFlow([
        { icon: "calendar", label: "重复" },
        { icon: "bot", label: "初稿", tone: "tone-ai" },
        { icon: "search", label: "检查" },
        { icon: "sliders", label: "标准", tone: "tone-human" },
        { icon: "refresh", label: "复用", tone: "tone-ai" },
        { icon: "chart", label: "改进", tone: "tone-result", result: true }
      ], [68, 201, 334, 467, 600, 733], 190, 72),

      systemFlow([
        { icon: "target", label: "真实结果？", tone: "tone-result", result: true },
        { icon: "scale", label: "人来判断？", tone: "tone-human" },
        { icon: "refresh", label: "能否复用？", tone: "tone-ai" }
      ], [140, 400, 660], 190, 108),

      systemFlow([
        { icon: "help", label: "理解问题" },
        { icon: "bot", label: "快速试错", tone: "tone-ai" },
        { icon: "scale", label: "作出判断", tone: "tone-human" },
        { icon: "shield", label: "负责结果", tone: "tone-result", result: true }
      ], [95, 300, 505, 710], 190, 94)
    ];

    slides.forEach((slide, index) => { slide.visual = standardizedVisuals[index]; });

    const stage = document.getElementById("stage");
    const progressFill = document.getElementById("progressFill");
    const consoleTitle = document.getElementById("consoleTitle");
    const counter = document.getElementById("counter");
    const notes = document.getElementById("notes");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const playButton = document.getElementById("playButton");
    const modelLabels = ["专业场景", "AI 调度", "判断决策", "信任协作", "结果责任"];
    const phaseBySlide = [4, 1, 4, 4, 1, 0, 2, 2, 4, 4, 4, 3, 3, 0, 3, 2, 4, 1, 4, 4];

    function slideTemplate(slide, i) {
      return `<article class="slide" data-slide="${i}" aria-label="${slide.chapterName}">
        <header class="slide-head">
          <span class="chapter-number">${String(slide.chapter).padStart(2, "0")}</span>
          <span class="chapter-name">${slide.chapterName}</span>
          <span class="slide-count">${String(i + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span>
        </header>
        <h1 class="claim">${slide.claim}</h1>
        <div class="visual">${slide.visual}</div>
        <footer class="slide-foot"><div class="model-rail">${modelLabels.map((label, phase) => `<span class="model-step ${phase === phaseBySlide[i] ? "is-active" : ""}">${label}</span>`).join("")}</div></footer>
      </article>`;
    }

    stage.insertAdjacentHTML("afterbegin", slides.map(slideTemplate).join(""));
    const slideElements = [...stage.querySelectorAll(".slide")];
    let current = 0;
    let isPlaying = false;
    let timer = null;

    function render(next, replay = false) {
      current = (next + slides.length) % slides.length;
      slideElements.forEach((el, i) => {
        el.classList.toggle("is-active", i === current);
        if (replay && i === current) {
          el.classList.remove("is-active");
          void el.offsetWidth;
          el.classList.add("is-active");
        }
      });
      const slide = slides[current];
      progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
      consoleTitle.textContent = `${String(slide.chapter).padStart(2, "0")} · ${slide.chapterName}`;
      counter.textContent = `${String(current + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
      notes.textContent = slide.note;
      if (isPlaying) schedule();
    }

    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (current === slides.length - 1) {
          stop();
          return;
        }
        render(current + 1, true);
      }, 15000);
    }

    function play() {
      isPlaying = true;
      playButton.textContent = "暂停";
      schedule();
    }

    function stop() {
      isPlaying = false;
      playButton.textContent = "自动播放";
      clearTimeout(timer);
    }

    prevButton.addEventListener("click", () => render(current - 1, true));
    nextButton.addEventListener("click", () => render(current + 1, true));
    playButton.addEventListener("click", () => isPlaying ? stop() : play());

    window.addEventListener("keydown", event => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
      if (event.key === "ArrowRight") render(current + 1, true);
      if (event.key === "ArrowLeft") render(current - 1, true);
      if (event.key.toLowerCase() === "r") render(current, true);
      if (event.code === "Space") { event.preventDefault(); isPlaying ? stop() : play(); }
    });

    const params = new URLSearchParams(location.search);
    if (params.get("clean") === "1") document.body.classList.add("clean");
    render(0, true);
    if (params.get("autoplay") === "1") play();
  </script>

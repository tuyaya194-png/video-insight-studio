<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI 增强型的人｜文字精读版</title>
  <style>
    :root {
      --paper: #eef2f5;
      --paper-strong: #f9fbfc;
      --ink: #12233d;
      --muted: #667387;
      --line: #c9d2dc;
      --ai: #2767db;
      --ai-soft: #dce9ff;
      --human: #f2a93b;
      --human-soft: #fff0d4;
      --result: #17735d;
      --result-soft: #d9f1ea;
      --risk: #d75b4b;
      --shadow: 0 28px 70px rgba(6, 20, 38, .28);
      --radius: 1.8cqw;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: #0e1928;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    button, select { font: inherit; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid #8eb7ff;
      outline-offset: 3px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 390px);
      gap: 28px;
      align-items: center;
      padding: 28px;
    }

    .preview-column {
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .stage-wrap {
      width: min(76vw, calc(90vh * .75));
      aspect-ratio: 3 / 4;
      position: relative;
      filter: drop-shadow(var(--shadow));
    }

    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      container-type: inline-size;
      background:
        linear-gradient(rgba(18,35,61,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18,35,61,.045) 1px, transparent 1px),
        var(--paper);
      background-size: 5cqw 5cqw;
      border: 1px solid rgba(255,255,255,.18);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(112deg, rgba(255,255,255,.64), transparent 52%);
      pointer-events: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 6.2cqw 6.4cqw 17cqw;
      opacity: 0;
      transform: translateY(1.8cqw);
      pointer-events: none;
    }

    .scene.is-active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      animation: sceneIn .55s cubic-bezier(.2,.75,.25,1) both;
    }

    .scene-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 2.2cqw;
      padding-bottom: 2.3cqw;
      border-bottom: .16cqw solid var(--line);
    }

    .chapter-index {
      width: 6.2cqw;
      height: 6.2cqw;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      border-radius: 50%;
      font: 700 2.4cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .chapter-name {
      font-size: 2.15cqw;
      font-weight: 720;
      letter-spacing: .04em;
    }

    .scene-count {
      color: var(--muted);
      font: 650 1.65cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .scene-body {
      min-height: 0;
      display: grid;
      align-content: center;
      padding: 4.8cqw 0 2cqw;
    }

    .eyebrow {
      margin: 0 0 2cqw;
      color: var(--ai);
      font: 750 1.7cqw/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1, h2 {
      margin-bottom: 2.6cqw;
      text-wrap: balance;
      letter-spacing: -.045em;
      line-height: 1.08;
    }

    h1 { font-size: 7.25cqw; font-weight: 840; }
    h2 { font-size: 5.65cqw; font-weight: 830; }

    .lede {
      max-width: 86%;
      margin-bottom: 3cqw;
      color: var(--muted);
      font-size: 2.65cqw;
      line-height: 1.58;
    }

    .big-quote {
      margin: 0;
      font-size: 4.7cqw;
      font-weight: 790;
      line-height: 1.38;
      letter-spacing: -.03em;
    }

    .big-quote strong { color: var(--ai); }

    .accent-human,
    .accent-ai,
    .accent-result,
    .accent-risk {
      padding-inline: .08em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .accent-human { color: #925a05; background: linear-gradient(transparent 66%, var(--human-soft) 0); }
    .accent-ai { color: var(--ai); background: linear-gradient(transparent 66%, var(--ai-soft) 0); }
    .accent-result { color: var(--result); background: linear-gradient(transparent 66%, var(--result-soft) 0); }
    .accent-risk { color: var(--risk); background: linear-gradient(transparent 66%, #ffe3df 0); }

    .line-icon {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible;
    }

    .icon-badge {
      width: 6.2cqw;
      height: 6.2cqw;
      flex: 0 0 6.2cqw;
      display: inline-grid;
      place-items: center;
      padding: 1.25cqw;
      border: .16cqw solid currentColor;
      border-radius: 50%;
      color: var(--ink);
      background: var(--paper-strong);
      position: relative;
      vertical-align: middle;
    }

    /* 本版以排版和关系图为主，图标函数保留兼容但不参与画面。 */
    .icon-badge { display: none; }

    .icon-badge.is-mini {
      width: 3.6cqw;
      height: 3.6cqw;
      flex-basis: 3.6cqw;
      padding: .7cqw;
      border-width: .13cqw;
    }

    .icon-badge.ai { color: var(--ai); background: var(--ai-soft); }
    .icon-badge.human { color: #9a5b00; background: var(--human-soft); }
    .icon-badge.result { color: var(--result); background: var(--result-soft); }
    .icon-badge.risk { color: var(--risk); background: #ffe3df; }
    .icon-badge.ink { color: var(--ink); background: #fff; }

    .icon-with-label {
      display: inline-flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .is-active .icon-badge.ai .line-icon { animation: iconBreathe 2.2s ease-in-out infinite; }
    .is-active .icon-badge.human { animation: humanDecision .7s cubic-bezier(.2,.8,.25,1) .45s both; }
    .is-active .icon-badge.result { animation: resultPulse 1.8s ease-in-out .6s infinite; }
    .is-active .icon-badge.risk { animation: riskNudge 2.4s ease-in-out .8s infinite; }

    .scene-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
      color: var(--muted);
      font-size: 1.55cqw;
    }

    .scene-foot strong { color: var(--ink); }

    .reveal, .stagger > * {
      opacity: 0;
      transform: translateY(2.2cqw);
    }

    .is-active .reveal,
    .is-active .stagger > * {
      animation: rise .58s cubic-bezier(.2,.75,.25,1) both;
      animation-delay: var(--delay, .12s);
    }

    .is-active .stagger > *:nth-child(1) { animation-delay: .12s; }
    .is-active .stagger > *:nth-child(2) { animation-delay: .24s; }
    .is-active .stagger > *:nth-child(3) { animation-delay: .36s; }
    .is-active .stagger > *:nth-child(4) { animation-delay: .48s; }
    .is-active .stagger > *:nth-child(5) { animation-delay: .60s; }
    .is-active .stagger > *:nth-child(6) { animation-delay: .72s; }
    .is-active .stagger > *:nth-child(7) { animation-delay: .84s; }
    .is-active .stagger > *:nth-child(8) { animation-delay: .96s; }

    .thesis-grid {
      display: grid;
      grid-template-columns: .8fr auto 1.35fr;
      align-items: center;
      gap: 2cqw;
      margin-top: 5cqw;
    }

    .thesis-box {
      min-height: 17cqw;
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: center;
      justify-content: center;
      place-items: center;
      padding: 2.6cqw;
      text-align: center;
      border: .18cqw solid var(--line);
      background: rgba(255,255,255,.66);
      font-size: 2.85cqw;
      font-weight: 760;
      line-height: 1.35;
    }

    .thesis-box.is-old { color: var(--muted); }
    .thesis-box.is-new { border-color: var(--ai); box-shadow: inset .7cqw 0 0 var(--ai); }
    .thesis-arrow { color: var(--ai); font-size: 5.2cqw; font-weight: 800; }
    .is-active .thesis-arrow, .is-active .loop-arrow { animation: arrowTravel 1.4s ease-in-out infinite; }

    .micro-note {
      margin: 3.2cqw 0 0;
      padding: 1.8cqw 2.2cqw;
      border-left: .5cqw solid var(--human);
      color: var(--ink);
      background: var(--human-soft);
      font-size: 2.1cqw;
      line-height: 1.45;
    }

    .division {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.4cqw;
      margin-top: 2.8cqw;
    }

    .lane {
      min-height: 42cqw;
      padding: 3cqw;
      border-top: .65cqw solid;
      background: rgba(255,255,255,.7);
    }

    .lane.ai { border-color: var(--ai); }
    .lane.human { border-color: var(--human); }

    .lane-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.6cqw;
      font-size: 3.3cqw;
      font-weight: 810;
    }

    .lane-head small {
      font: 700 1.45cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
    }

    .task-list { display: grid; gap: 1.25cqw; }

    .task-chip {
      display: flex;
      align-items: center;
      gap: 1cqw;
      padding: 1.35cqw 1.7cqw;
      border: .14cqw solid var(--line);
      background: var(--paper-strong);
      font-size: 1.95cqw;
      font-weight: 670;
    }

    .ai .task-chip::before { content: ""; width: .7cqw; height: .7cqw; border-radius: 50%; background: var(--ai); box-shadow: 0 0 0 .4cqw var(--ai-soft); }
    .human .task-chip::before { content: ""; width: .9cqw; height: .9cqw; background: var(--human); transform: rotate(45deg); }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      margin-top: 2.4cqw;
    }

    .person-card {
      padding: 3.1cqw;
      background: rgba(255,255,255,.75);
      border: .16cqw solid var(--line);
      position: relative;
    }

    .person-card.enhanced { border-color: var(--result); box-shadow: inset 0 -.75cqw 0 var(--result); }

    .person-label {
      display: inline-block;
      margin-bottom: 2.5cqw;
      padding: .8cqw 1.2cqw;
      background: var(--ink);
      color: #fff;
      font: 700 1.5cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .enhanced .person-label { background: var(--result); }

    .speech {
      margin: 0;
      font-size: 2.25cqw;
      line-height: 1.55;
    }

    .speech strong { color: var(--result); }

    .mini-chart {
      height: 9cqw;
      display: flex;
      align-items: end;
      gap: 1cqw;
      margin-top: 2cqw;
      padding: 1cqw 1.4cqw;
      border-left: .15cqw solid var(--line);
      border-bottom: .15cqw solid var(--line);
    }

    .mini-chart i { width: 2.5cqw; height: var(--h); background: var(--ai); transform-origin: bottom; }
    .mini-chart i:last-child { background: var(--result); }
    .is-active .mini-chart i { animation: barGrow .75s cubic-bezier(.2,.8,.25,1) both; animation-delay: var(--d); }

    .loop {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      gap: .8cqw;
      margin-top: 5cqw;
    }

    .loop-node {
      min-height: 11cqw;
      display: grid;
      place-items: center;
      padding: 1cqw;
      text-align: center;
      border: .16cqw solid var(--line);
      background: rgba(255,255,255,.82);
      font-size: 1.65cqw;
      font-weight: 720;
      line-height: 1.25;
    }

    .loop-node:nth-child(odd) { transform: translateY(-1cqw); }
    .loop-node:last-child { background: var(--result); color: #fff; border-color: var(--result); }
    .loop-arrow { text-align: center; color: var(--ai); font-size: 2.2cqw; }

    .process-flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.8cqw;
      margin-top: 5cqw;
      counter-reset: process;
    }

    .process-step {
      counter-increment: process;
      min-height: 14cqw;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 1.6cqw;
      padding: 2.2cqw;
      background: rgba(255,255,255,.8);
      border-top: .45cqw solid var(--line);
      font-size: 2.15cqw;
      font-weight: 760;
      line-height: 1.3;
    }

    .process-step::before {
      content: counter(process, decimal-leading-zero);
      color: var(--ai);
      font: 800 1.6cqw/1 ui-monospace, monospace;
    }

    .process-step:nth-child(4),
    .process-step:nth-child(5) { border-color: var(--human); }

    .process-step:last-child {
      color: #fff;
      background: var(--result);
      border-color: var(--result);
    }

    .process-step:last-child::before { color: #bfe8dc; }

    .commodity-board {
      display: grid;
      grid-template-columns: 1fr .45fr;
      gap: 3.2cqw;
      margin-top: 3cqw;
    }

    .commodity-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw; }

    .commodity {
      display: flex;
      align-items: center;
      gap: 1.4cqw;
      padding: 1.7cqw;
      background: rgba(255,255,255,.78);
      border-bottom: .2cqw solid var(--line);
      font-size: 1.85cqw;
      font-weight: 650;
    }

    .price-meter {
      min-height: 35cqw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 2.5cqw;
      color: #fff;
      background: var(--ink);
    }

    .price-meter span { font-size: 1.45cqw; letter-spacing: .08em; }
    .price-meter strong { align-self: center; font-size: 7.5cqw; line-height: 1; }
    .price-meter b { color: #9bbdff; font-size: 1.8cqw; }

    .knowledge-timeline {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2cqw;
      margin-top: 4cqw;
    }

    .era {
      min-height: 34cqw;
      padding: 2.7cqw;
      border-top: .7cqw solid var(--line);
      background: rgba(255,255,255,.76);
    }

    .era:nth-child(2) { border-color: var(--ai); }
    .era:nth-child(3) { border-color: var(--human); }
    .era time { color: var(--muted); font: 700 1.5cqw/1 ui-monospace, monospace; }
    .era h3 { margin: 4.5cqw 0 1.4cqw; font-size: 3cqw; line-height: 1.25; }
    .era p { margin: 0; color: var(--muted); font-size: 1.75cqw; line-height: 1.45; }

    .question-stack {
      display: grid;
      gap: 1.4cqw;
      margin-top: 2.5cqw;
      perspective: 900px;
    }

    .question {
      display: grid;
      grid-template-columns: 4cqw 1fr;
      gap: 1.4cqw;
      align-items: center;
      padding: 1.5cqw 2cqw;
      background: rgba(255,255,255,.82);
      border-left: .5cqw solid var(--human);
      font-size: 1.9cqw;
      font-weight: 670;
    }

    .question b { color: var(--human); font: 800 1.45cqw/1 ui-monospace, monospace; }

    .judgement-three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2cqw;
      margin: 3.5cqw 0;
    }

    .judgement-piece {
      min-height: 19cqw;
      display: grid;
      align-content: space-between;
      padding: 2.5cqw;
      background: var(--paper-strong);
      border: .16cqw solid var(--line);
    }

    .judgement-piece b { color: var(--human); font: 800 3.2cqw/1 ui-monospace, monospace; }
    .judgement-piece span { font-size: 2.4cqw; font-weight: 770; line-height: 1.3; }

    .decision-card {
      padding: 2.5cqw 3cqw;
      color: #fff;
      background: var(--ink);
      border-left: 1cqw solid var(--human);
      font-size: 2.3cqw;
      line-height: 1.5;
    }

    .value-table {
      margin-top: 2.2cqw;
      border-top: .2cqw solid var(--ink);
    }

    .value-row {
      display: grid;
      grid-template-columns: .9fr 1.35fr;
      gap: 2.4cqw;
      padding: 1.7cqw 1cqw;
      border-bottom: .14cqw solid var(--line);
      font-size: 1.75cqw;
      line-height: 1.35;
    }

    .value-row > span:nth-child(2) { color: var(--muted); }
    .value-row > span:last-child { color: var(--result); font-weight: 720; }

    .sell-flow {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2.2cqw;
      align-items: center;
      margin: 4cqw 0;
    }

    .sell-box {
      min-height: 22cqw;
      display: grid;
      align-content: center;
      padding: 2.8cqw;
      background: rgba(255,255,255,.78);
      border: .18cqw solid var(--line);
    }

    .sell-box:last-child { border-color: var(--result); }
    .sell-box small { color: var(--muted); font-size: 1.5cqw; }
    .sell-box strong { margin-top: 1.2cqw; font-size: 3cqw; line-height: 1.25; }
    .sell-arrow { color: var(--result); font-size: 4.5cqw; }

    .deliverables { display: flex; flex-wrap: wrap; gap: 1.3cqw; }
    .deliverables span { display: inline-flex; align-items: center; gap: .8cqw; padding: 1.4cqw 1.7cqw; background: var(--result-soft); color: var(--result); font-size: 1.8cqw; font-weight: 720; }

    .network {
      position: relative;
      height: 40cqw;
      margin-top: 2cqw;
      isolation: isolate;
    }

    .network::before, .network::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      top: 50%;
      height: .2cqw;
      background: var(--line);
      transform: rotate(20deg);
      transform-origin: center;
      z-index: 0;
      pointer-events: none;
    }

    .network::after { transform: rotate(-20deg); }

    .person-node {
      position: absolute;
      width: 9cqw;
      height: 9cqw;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      font-size: 1.55cqw;
      font-weight: 720;
      box-shadow: 0 0 0 1cqw rgba(18,35,61,.08);
      z-index: 1;
    }

    .person-node .line-icon { display: none; }
    .person-node small { font-size: 1.7cqw; }

    .person-node:nth-child(1) { left: 7%; top: 10%; }
    .person-node:nth-child(2) { right: 7%; top: 8%; }
    .person-node:nth-child(3) { left: 10%; bottom: 6%; }
    .person-node:nth-child(4) { right: 10%; bottom: 8%; }
    .person-node.center { left: 50%; top: 50%; width: 13cqw; height: 13cqw; transform: translate(-50%,-50%); background: var(--human); color: var(--ink); }

    .eq-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.1cqw;
      margin-top: 2cqw;
    }

    .eq-tags span { padding: 1.1cqw 1.5cqw; background: rgba(255,255,255,.8); border: .13cqw solid var(--line); font-size: 1.6cqw; font-weight: 680; }

    .iceberg {
      display: grid;
      grid-template-rows: auto .18cqw auto;
      margin-top: 4cqw;
    }

    .said, .unsaid { width: 76%; margin-inline: auto; text-align: center; }
    .said { padding: 2.5cqw; background: var(--ai-soft); color: var(--ai); font-size: 2.5cqw; font-weight: 780; clip-path: polygon(20% 0,80% 0,65% 100%,35% 100%); }
    .waterline { background: var(--ai); }
    .unsaid { padding: 5cqw 4cqw 4cqw; color: #fff; background: var(--ink); font-size: 3.1cqw; font-weight: 800; clip-path: polygon(35% 0,65% 0,100% 100%,0 100%); }

    .capability-stack {
      display: grid;
      align-items: end;
      gap: 1.25cqw;
      width: 88%;
      margin: 4cqw auto 0;
    }

    .stack-layer {
      min-height: 12cqw;
      display: grid;
      grid-template-columns: 8cqw 1fr;
      gap: 2cqw;
      align-items: center;
      padding: 2cqw 3cqw;
      color: #fff;
      background: var(--ink);
    }

    .stack-layer:nth-child(1) { width: 72%; margin-inline: auto; background: var(--human); color: var(--ink); }

    .fork {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      margin-top: 3.2cqw;
    }

    .fork-lane { padding: 3cqw; min-height: 38cqw; background: rgba(255,255,255,.78); border-top: .6cqw solid var(--line); }
    .fork-lane:last-child { border-color: var(--result); }
    .fork-lane h3 { font-size: 2.7cqw; line-height: 1.2; }
    .fork-lane h3 { display: flex; align-items: center; gap: 1.2cqw; }
    .fork-lane ul { margin: 2.2cqw 0 0; padding: 0; list-style: none; display: grid; gap: 1.35cqw; }
    .fork-lane li { font-size: 1.75cqw; line-height: 1.35; }
    .fork-lane li::before { content: "— "; color: var(--muted); }
    .fork-lane:last-child li::before { content: "✓ "; color: var(--result); font-weight: 800; }

    .split-question {
      display: grid;
      gap: 2cqw;
      margin-top: 4cqw;
    }

    .split-question div {
      display: flex;
      align-items: center;
      gap: 2cqw;
      padding: 3cqw;
      font-size: 3.1cqw;
      font-weight: 790;
      background: rgba(255,255,255,.78);
      border-left: .7cqw solid var(--line);
    }

    .split-question div:last-child { border-color: var(--result); color: var(--result); }

    .start-steps {
      display: grid;
      gap: 1.25cqw;
      margin-top: 2.2cqw;
      counter-reset: steps;
    }

    .start-step {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 5cqw 1fr;
      gap: 1.5cqw;
      align-items: center;
      padding: 1.35cqw 1.7cqw;
      background: rgba(255,255,255,.8);
      border-bottom: .15cqw solid var(--line);
      font-size: 1.75cqw;
      font-weight: 670;
    }

    .start-step::before {
      content: counter(steps, decimal-leading-zero);
      color: var(--ai);
      font: 780 1.55cqw/1 ui-monospace, monospace;
    }

    .review-three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.8cqw;
      margin-top: 4cqw;
    }

    .review-card {
      min-height: 25cqw;
      padding: 2.4cqw;
      display: grid;
      align-content: space-between;
      background: rgba(255,255,255,.8);
      border: .15cqw solid var(--line);
    }

    .review-card b { color: var(--ai); font: 800 3.2cqw/1 ui-monospace, monospace; }
    .review-card span { font-size: 2.35cqw; font-weight: 760; line-height: 1.38; }

    .final-statement {
      display: grid;
      gap: 2cqw;
      margin-top: 4cqw;
    }

    .final-statement span {
      display: flex;
      align-items: center;
      gap: 1.6cqw;
      padding: 2.4cqw 2.8cqw;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      font-size: 2.45cqw;
      font-weight: 700;
      transform-origin: left center;
    }

    .final-statement span:last-child { color: #fff; background: var(--result); font-size: 3.2cqw; }

    .outcome-rail {
      position: absolute;
      left: 6.4cqw;
      right: 6.4cqw;
      bottom: 8cqw;
      z-index: 20;
    }

    .rail-line {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 1.65cqw;
      height: .28cqw;
      background: var(--line);
      z-index: 0;
    }

    .rail-fill {
      width: 0;
      height: 100%;
      background: var(--result);
      transition: width .55s ease;
    }

    .rail-nodes {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 1;
    }

    .rail-node { text-align: center; color: var(--muted); font-size: 1.25cqw; font-weight: 690; }
    .rail-dot { width: 3.3cqw; height: 3.3cqw; display: grid; place-items: center; margin: 0 auto .8cqw; padding: 0; border: .42cqw solid var(--paper); border-radius: 50%; color: var(--muted); background: var(--paper-strong); box-shadow: 0 0 0 .18cqw var(--line); }
    .rail-dot .line-icon { display: none; }
    .rail-node.is-done, .rail-node.is-current { color: var(--result); }
    .rail-node.is-done .rail-dot { background: var(--result); box-shadow: 0 0 0 .18cqw var(--result); }
    .rail-node.is-current .rail-dot { background: var(--human); box-shadow: 0 0 0 .18cqw var(--result), 0 0 0 1cqw rgba(23,115,93,.12); animation: pulse 1.6s ease-in-out infinite; }

    .side-panel {
      align-self: stretch;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 18px;
      min-height: 0;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.055);
      color: #edf4ff;
    }

    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .panel-head strong { font-size: 17px; }
    .timecode { font: 700 13px/1 ui-monospace, monospace; color: #a9b8cc; }

    .control-row { display: grid; grid-template-columns: 44px 1fr 44px 86px; gap: 9px; }

    .control-row button, .control-row select, .secondary-button {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.13);
      color: #edf4ff;
      background: rgba(255,255,255,.08);
      cursor: pointer;
    }

    .control-row button:hover, .secondary-button:hover { background: rgba(255,255,255,.14); }
    .control-row select { padding: 0 8px; }

    .timeline {
      position: relative;
      height: 8px;
      margin-top: 12px;
      background: rgba(255,255,255,.12);
      cursor: pointer;
    }

    .timeline-fill { width: 0; height: 100%; background: #78a6ff; }

    .narration-panel {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      color: #d8e2ef;
      background: rgba(5,14,25,.44);
      border-left: 3px solid var(--human);
    }

    .narration-panel h3 { margin: 0 0 12px; color: #fff; font-size: 14px; letter-spacing: .08em; }
    .narration-panel p { margin: 0; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }

    .chapters { display: flex; flex-wrap: wrap; gap: 7px; }
    .chapter-button { padding: 7px 9px; border: 1px solid rgba(255,255,255,.1); color: #aebed1; background: transparent; font-size: 12px; cursor: pointer; }
    .chapter-button.is-active { color: #fff; border-color: #78a6ff; background: rgba(120,166,255,.14); }

    .keyboard-hint { margin: 0; color: #91a0b4; font-size: 12px; line-height: 1.5; }

    body.clean { background: #0e1928; overflow: hidden; }
    body.clean .app { display: grid; place-items: center; width: 100vw; height: 100vh; min-height: 0; padding: 0; }
    body.clean .side-panel { display: none; }
    body.clean .preview-column { width: 100%; height: 100%; display: grid; place-items: center; }
    body.clean .stage-wrap { width: min(100vw, 75vh); height: auto; max-height: 100vh; aspect-ratio: 3 / 4; }
    body.clean .stage { width: 100%; height: 100%; }

    @keyframes sceneIn { from { opacity: 0; transform: translateY(2cqw); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(2.2cqw); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
    @keyframes iconBreathe { 0%,100% { transform: scale(.92); opacity: .72; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes humanDecision { 0% { transform: rotate(-18deg) scale(.72); opacity: 0; } 70% { transform: rotate(5deg) scale(1.08); opacity: 1; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    @keyframes resultPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(23,115,93,.16); } 50% { box-shadow: 0 0 0 1.1cqw rgba(23,115,93,0); } }
    @keyframes riskNudge { 0%,88%,100% { transform: translateX(0); } 91% { transform: translateX(-.35cqw); } 95% { transform: translateX(.35cqw); } }
    @keyframes arrowTravel { 0%,100% { transform: translateX(-.35cqw); opacity: .5; } 50% { transform: translateX(.5cqw); opacity: 1; } }
    @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; padding: 16px; }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

            <span class="chapter-name">${scene.chapterName}</span>
            <span class="scene-count">${String(sceneIndex + 1).padStart(2, "0")} / ${String(scenes.length).padStart(2, "0")}</span>
          </header>
          <div class="scene-body">${scene.visual}</div>
          <footer class="scene-foot"><span>AI 增强型的人</span><strong>${scene.title}</strong></footer>
        </section>`;
    }

    stage.insertAdjacentHTML("afterbegin", scenes.map(sceneTemplate).join(""));
    const sceneElements = [...stage.querySelectorAll(".scene")];

    railNodes.innerHTML = railLabels.map((label, i) => `<div class="rail-node" data-rail="${i}"><div class="rail-dot"></div>${label}</div>`).join("");

    const chapterMap = [];
    scenes.forEach((scene, i) => {
      if (!chapterMap.some(item => item.chapter === scene.chapter)) chapterMap.push({ chapter: scene.chapter, name: scene.chapterName, index: i });
    });
    chapters.innerHTML = chapterMap.map(item => `<button class="chapter-button" type="button" data-target="${item.index}">${String(item.chapter).padStart(2, "0")} ${item.name}</button>`).join("");

    function updateRail(step) {
      const nodes = [...railNodes.querySelectorAll(".rail-node")];
      nodes.forEach((node, i) => {
        node.classList.toggle("is-done", i < step);
        node.classList.toggle("is-current", i === step);
      });
      railFill.style.width = `${step / (railLabels.length - 1) * 92}%`;
    }

    function renderScene(nextIndex, resetElapsed = true) {
      index = (nextIndex + scenes.length) % scenes.length;
      sceneElements.forEach((element, i) => element.classList.toggle("is-active", i === index));
      const scene = scenes[index];
      narration.textContent = scene.narration;
      panelTitle.textContent = `${String(scene.chapter).padStart(2, "0")} · ${scene.chapterName}`;
      updateRail(scene.rail);
      [...chapters.querySelectorAll(".chapter-button")].forEach(button => {
        const target = Number(button.dataset.target);
        button.classList.toggle("is-active", scenes[target].chapter === scene.chapter);
      });
      if (resetElapsed) sceneElapsed = 0;
      sceneStartedAt = performance.now();
      updateProgress();
    }

    function currentGlobalElapsed() {
      return sceneOffsets[index] + Math.min(sceneElapsed, durations[index]);
    }

    function updateProgress() {
      const global = currentGlobalElapsed();
      timelineFill.style.width = `${global / totalDuration * 100}%`;
      timecode.textContent = `${formatTime(global)} / ${formatTime(totalDuration)}`;
      timeline.setAttribute("aria-valuenow", String(Math.round(global / totalDuration * 100)));
    }

    function tick(now) {
      if (!isPlaying) return;
      sceneElapsed += (now - sceneStartedAt) * speed;
      sceneStartedAt = now;
      if (sceneElapsed >= durations[index]) {
        if (index === scenes.length - 1) {
          isPlaying = false;
          playButton.textContent = "重播";
          sceneElapsed = durations[index];
          updateProgress();
          return;
        }
        renderScene(index + 1, true);
      }
      updateProgress();
      animationFrame = requestAnimationFrame(tick);
    }

    function play() {
      if (index === scenes.length - 1 && sceneElapsed >= durations[index]) renderScene(0, true);
      isPlaying = true;
      sceneStartedAt = performance.now();
      playButton.textContent = "暂停";
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(tick);
    }

    function pause() {
      isPlaying = false;
      playButton.textContent = "播放";
      cancelAnimationFrame(animationFrame);
    }

    function togglePlay() { isPlaying ? pause() : play(); }

    function seekGlobal(targetMilliseconds) {
      const safeTarget = Math.max(0, Math.min(totalDuration - 1, targetMilliseconds));
      let nextIndex = durations.findIndex((duration, i) => safeTarget < sceneOffsets[i] + duration);
      if (nextIndex < 0) nextIndex = scenes.length - 1;
      renderScene(nextIndex, false);
      sceneElapsed = safeTarget - sceneOffsets[nextIndex];
      sceneStartedAt = performance.now();
      updateProgress();
    }

    playButton.addEventListener("click", togglePlay);
    prevButton.addEventListener("click", () => renderScene(index - 1, true));
    nextButton.addEventListener("click", () => renderScene(index + 1, true));
    speedSelect.addEventListener("change", () => { speed = Number(speedSelect.value); sceneStartedAt = performance.now(); });
    chapters.addEventListener("click", event => {
      const button = event.target.closest("button[data-target]");
      if (button) renderScene(Number(button.dataset.target), true);
    });
    timeline.addEventListener("click", event => {
      const rect = timeline.getBoundingClientRect();
      seekGlobal((event.clientX - rect.left) / rect.width * totalDuration);
    });
    timeline.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") seekGlobal(currentGlobalElapsed() + 10000);
      if (event.key === "ArrowLeft") seekGlobal(currentGlobalElapsed() - 10000);
    });
    window.addEventListener("keydown", event => {
      if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(document.activeElement?.tagName)) return;
      if (event.code === "Space") { event.preventDefault(); togglePlay(); }
      if (event.key === "ArrowRight") renderScene(index + 1, true);
      if (event.key === "ArrowLeft") renderScene(index - 1, true);
      if (event.key.toLowerCase() === "r") renderScene(index, true);
    });

    renderScene(0, true);
    if (autoplay) play();
  </script>
</body>
</html>

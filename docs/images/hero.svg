<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Video Insight Studio</title>
  <desc id="desc">Turn long or foreign-language videos into source-grounded analysis, one shared content master, and two HTML reading experiences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f37"/>
      <stop offset="1" stop-color="#172f4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5ae36"/>
      <stop offset="1" stop-color="#2c8c70"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020812" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="800" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="800" rx="36" fill="url(#grid)"/>
  <rect x="86" y="90" width="84" height="8" rx="4" fill="url(#accent)"/>
  <text x="86" y="184" fill="#f6f8fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="780">Video Insight Studio</text>
  <text x="90" y="266" fill="#f6f8fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">Long video → clear, reusable insight</text>
  <text x="90" y="338" fill="#aebed1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25">Cross-language understanding</text>
  <text x="90" y="379" fill="#aebed1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25">Deep reading + visual review</text>

  <g transform="translate(90 470)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="456" height="144" rx="24" fill="#fff" fill-opacity=".065" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="72" cy="72" r="36" fill="#f5ae36"/>
    <path d="M62 52l26 20-26 20Z" fill="#10233d"/>
    <text x="132" y="60" fill="#f6f8fb" font-size="24" font-weight="700">One source</text>
    <text x="132" y="95" fill="#9fb0c5" font-size="19">Analysis → master → two HTMLs</text>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="640" y="128" width="238" height="544" rx="28" fill="#f2f4f6"/>
    <text x="674" y="178" fill="#13233c" font-size="15" font-weight="700">01 / VERIFIED INPUT</text>
    <rect x="674" y="216" width="170" height="104" rx="18" fill="#142640"/>
    <circle cx="759" cy="268" r="27" fill="#f5ae36"/>
    <path d="M750 251l23 17-23 17Z" fill="#142640"/>
    <text x="674" y="360" fill="#13233c" font-size="22" font-weight="760"><tspan x="674">Captions &amp;</tspan><tspan x="674" dy="29">transcripts</tspan></text>
    <text x="674" y="430" fill="#667488" font-size="18">YouTube · SRT</text>
    <text x="674" y="458" fill="#667488" font-size="18">VTT · TXT</text>
    <path d="M674 495h168M674 530h142M674 565h156M674 600h112" stroke="#cbd2db" stroke-width="10" stroke-linecap="round"/>

    <path d="M906 400h74" stroke="#8291a3" stroke-width="4" stroke-linecap="round"/>
    <path d="m966 388 20 12-20 12Z" fill="#8291a3"/>

    <rect x="1010" y="92" width="210" height="280" rx="28" fill="#f2f4f6"/>
    <text x="1040" y="136" fill="#2f6fed" font-size="14" font-weight="750">DEEP READING</text>
    <text x="1040" y="184" fill="#13233c" font-size="21" font-weight="760">ZH / EN / bilingual</text>
    <path d="M1040 222h146M1040 250h132M1040 278h152M1040 306h110" stroke="#cbd2db" stroke-width="9" stroke-linecap="round"/>

    <rect x="1262" y="92" width="250" height="616" rx="28" fill="#f2f4f6"/>
    <text x="1294" y="136" fill="#2c8c70" font-size="14" font-weight="750">VISUAL REVIEW</text>
    <text x="1294" y="188" fill="#13233c" font-size="23" font-weight="760">One claim</text>
    <text x="1294" y="220" fill="#13233c" font-size="23" font-weight="760">One relationship</text>
    <circle cx="1387" cy="414" r="94" fill="none" stroke="#aeb8c4" stroke-width="4"/>
    <g fill="#f2f4f6" stroke="#aeb8c4" stroke-width="3">
      <rect x="1361" y="292" width="52" height="52" rx="13"/>
      <rect x="1444" y="346" width="52" height="52" rx="13"/>
      <rect x="1444" y="444" width="52" height="52" rx="13"/>
      <rect x="1361" y="486" width="52" height="52" rx="13"/>
      <rect x="1278" y="444" width="52" height="52" rx="13"/>
      <rect x="1278" y="346" width="52" height="52" rx="13"/>
    </g>
    <circle cx="1387" cy="414" r="15" fill="#2c8c70"/>
    <text x="1387" y="584" text-anchor="middle" fill="#2c8c70" font-size="18" font-weight="750">Scan and recall</text>

    <path d="M1115 392v56" stroke="#8291a3" stroke-width="4" stroke-linecap="round"/>
    <path d="m1103 434 12 20 12-20Z" fill="#8291a3"/>
    <rect x="1010" y="478" width="210" height="194" rx="28" fill="#142640"/>
    <text x="1040" y="524" fill="#f5ae36" font-size="14" font-weight="750">SHARED MASTER</text>
    <text x="1040" y="568" fill="#f6f8fb" font-size="21" font-weight="720">Same claims</text>
    <text x="1040" y="601" fill="#f6f8fb" font-size="21" font-weight="720">Same order</text>
    <text x="1040" y="634" fill="#9fb0c5" font-size="17">Different reading modes</text>
  </g>
</svg>

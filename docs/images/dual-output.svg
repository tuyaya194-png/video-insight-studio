<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One content master, two HTML experiences</title>
  <desc id="desc">Deep-reading and visual-review HTML present the same core claim at two reading speeds.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#13233c" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#13233c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#e8ecef"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>
  <text x="800" y="82" text-anchor="middle" fill="#13233c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="780">One content master, two reading speeds</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="170" y="138" width="500" height="666" rx="24" fill="#f4f6f7"/>
    <text x="212" y="188" fill="#2f6fed" font-size="15" font-weight="750">DEEP READING · ZH / EN / BILINGUAL</text>
    <text x="212" y="252" fill="#13233c" font-size="31" font-weight="780">AI makes standard answers cheaper.</text>
    <text x="212" y="297" fill="#13233c" font-size="31" font-weight="780">Knowledge changes its job.</text>
    <rect x="212" y="354" width="416" height="128" rx="18" fill="#e6edfb"/>
    <text x="238" y="397" fill="#2f6fed" font-size="18" font-weight="750">BEFORE</text>
    <text x="238" y="437" fill="#13233c" font-size="24" font-weight="720">Produce the first answer</text>
    <text x="238" y="469" fill="#69778a" font-size="18">memory · speed · standard form</text>
    <rect x="212" y="510" width="416" height="156" rx="18" fill="#dfeee9"/>
    <text x="238" y="553" fill="#2c8c70" font-size="18" font-weight="750">NOW</text>
    <text x="238" y="593" fill="#13233c" font-size="24" font-weight="720">Judge whether it is reliable</text>
    <text x="238" y="625" fill="#69778a" font-size="18">questions · exceptions · decisions</text>
    <text x="212" y="724" fill="#69778a" font-size="18">For full understanding and repeated reference.</text>

    <rect x="930" y="138" width="500" height="666" rx="24" fill="#f4f6f7"/>
    <text x="972" y="188" fill="#2c8c70" font-size="15" font-weight="750">VISUAL REVIEW HTML</text>
    <text x="1180" y="252" text-anchor="middle" fill="#13233c" font-size="31" font-weight="780">Knowledge shifts</text>
    <text x="1180" y="295" text-anchor="middle" fill="#2c8c70" font-size="31" font-weight="780">from output to judgment</text>
    <path d="M1038 474H1322" stroke="#aeb8c4" stroke-width="5" stroke-linecap="round"/>
    <path d="m1302 461 24 13-24 13Z" fill="#aeb8c4"/>
    <g>
      <rect x="1004" y="414" width="120" height="120" rx="24" fill="#f4f6f7" stroke="#aeb8c4" stroke-width="4"/>
      <path d="M1040 448h48v56h-48Zm12 13h24m-24 13h24m-24 13h16" fill="none" stroke="#13233c" stroke-width="5" stroke-linecap="round"/>
      <text x="1064" y="581" text-anchor="middle" fill="#13233c" font-size="23" font-weight="740">Answer</text>
    </g>
    <g>
      <rect x="1236" y="414" width="120" height="120" rx="24" fill="#f4f6f7" stroke="#93bbae" stroke-width="4"/>
      <circle cx="1290" cy="468" r="22" fill="none" stroke="#2c8c70" stroke-width="5"/>
      <path d="m1306 484 19 19" stroke="#2c8c70" stroke-width="6" stroke-linecap="round"/>
      <text x="1296" y="581" text-anchor="middle" fill="#2c8c70" font-size="23" font-weight="740">Judgment</text>
    </g>
    <text x="1180" y="694" text-anchor="middle" fill="#69778a" font-size="18">For fast scanning and structural recall.</text>
  </g>

  <circle cx="800" cy="470" r="58" fill="#13233c"/>
  <text x="800" y="461" text-anchor="middle" fill="#f5ae36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="760">SAME</text>
  <text x="800" y="488" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="720">CORE CLAIM</text>
</svg>

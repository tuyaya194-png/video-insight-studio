<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Viewpoint-analysis manuscript</title><desc id="desc">A structured analysis from the source argument to practical relevance, risks, and testable actions.</desc>
  <rect width="900" height="1200" fill="#f2f4f6"/>
  <text x="74" y="86" fill="#13233c" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="760">viewpoint-analysis.md</text><text x="826" y="86" text-anchor="end" fill="#278c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="760">SOURCE → ARGUMENT → USE</text><line x1="74" y1="118" x2="826" y2="118" stroke="#cbd2db" stroke-width="2"/>
  <text x="74" y="200" fill="#13233c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="45" font-weight="820"><tspan x="74">First map what the speaker says.</tspan><tspan x="74" dy="58">Then ask: “Why does this</tspan><tspan x="74" dy="58">matter in ordinary life?”</tspan></text>
  <text x="74" y="415" fill="#6a788b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Separate claims, examples, interpretation, and applicability.</text>
  <rect x="74" y="462" width="752" height="154" rx="18" fill="#fff"/><rect x="74" y="462" width="9" height="154" rx="4" fill="#f5ae36"/><text x="112" y="512" fill="#13233c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="720"><tspan x="112">The future gap is the ability to turn an ambiguous problem</tspan><tspan x="112" dy="40">into a reliable result that other people will adopt.</tspan></text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <line x1="74" y1="666" x2="826" y2="666" stroke="#cbd2db" stroke-width="2"/>
    <g transform="translate(0 0)"><circle cx="101" cy="719" r="24" fill="#13233c"/><text x="101" y="727" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">1</text><text x="148" y="714" fill="#13233c" font-size="25" font-weight="760">Argument map</text><text x="148" y="746" fill="#6a788b" font-size="19">thesis · supporting claims · evidence · sequence</text></g>
    <line x1="74" y1="782" x2="826" y2="782" stroke="#cbd2db" stroke-width="2"/>
    <g><circle cx="101" cy="835" r="24" fill="#2f6fed"/><text x="101" y="843" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">2</text><text x="148" y="830" fill="#13233c" font-size="25" font-weight="760">Practical relevance</text><text x="148" y="862" fill="#6a788b" font-size="19">work · efficiency · income · new value</text></g>
    <line x1="74" y1="898" x2="826" y2="898" stroke="#cbd2db" stroke-width="2"/>
    <g><circle cx="101" cy="951" r="24" fill="#278c70"/><text x="101" y="959" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">3</text><text x="148" y="946" fill="#13233c" font-size="25" font-weight="760">Risks and boundaries</text><text x="148" y="978" fill="#6a788b" font-size="19">do not turn a trend into certainty or inference into quotation</text></g>
    <line x1="74" y1="1014" x2="826" y2="1014" stroke="#cbd2db" stroke-width="2"/>
    <g><circle cx="101" cy="1067" r="24" fill="#f5ae36"/><text x="101" y="1075" text-anchor="middle" fill="#13233c" font-size="18" font-weight="800">4</text><text x="148" y="1062" fill="#13233c" font-size="25" font-weight="760">Testable action</text><text x="148" y="1094" fill="#6a788b" font-size="19">compare time, quality, and the steps that still need judgment</text></g>
  </g>
  <text x="74" y="1164" fill="#278c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="760">OUTPUT · COMPLETE ANALYSIS MANUSCRIPT</text><text x="826" y="1164" text-anchor="end" fill="#6a788b" font-family="ui-monospace,Menlo,monospace" font-size="18">02 / 04</text>
</svg>
